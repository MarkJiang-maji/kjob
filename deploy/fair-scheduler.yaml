# kjob fair scheduler (optional, installed once per cluster by an administrator).
#
# Releases jobs submitted with `ksub --fair`: they are created suspended, and this Deployment starts them, the
# namespace holding the least GPUs first. Other jobs are not touched. See docs/ADMIN.md.
#
#   kubectl apply -f deploy/fair-scheduler.yaml      # install / update
#   kubectl delete -f deploy/fair-scheduler.yaml     # remove (queued jobs stay Queued until released or cancelled)
#
# The pod installs kjob from GitHub at start-up (outbound HTTPS). Set KJOB_SOURCE to a reviewed commit that contains
# kjob/scheduler.py before applying; the placeholder below keeps the pod from starting until then. Run one replica
# only, because passes of two schedulers would not see each other's reservations.
apiVersion: v1
kind: Namespace
metadata:
  name: kjob-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kjob-fair-scheduler
  namespace: kjob-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kjob-fair-scheduler
rules:
  - apiGroups: [""]
    resources: [nodes, pods, resourcequotas]
    verbs: [get, list]
  - apiGroups: [kubeflow.org]
    resources: [pytorchjobs]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kjob-fair-scheduler
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kjob-fair-scheduler}
subjects:
  - {kind: ServiceAccount, name: kjob-fair-scheduler, namespace: kjob-system}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kjob-fair-scheduler
  namespace: kjob-system
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: kjob-fair-scheduler}
  template:
    metadata:
      labels: {app: kjob-fair-scheduler}
      annotations: {sidecar.istio.io/inject: "false"}
    spec:
      serviceAccountName: kjob-fair-scheduler
      securityContext: {runAsUser: 65534, runAsGroup: 65534, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: scheduler
          image: python:3.12-slim
          env:
            - {name: HOME, value: /tmp}
            - {name: PYTHONPATH, value: /tmp/kjob-lib}
            - {name: KJOB_SOURCE, value: "https://github.com/MarkJiang-maji/kjob/archive/SET_REVIEWED_COMMIT_SHA.tar.gz"}
          command: [sh, -c]
          args:
            - >-
              pip install --quiet --no-cache-dir --target /tmp/kjob-lib --only-binary=:all: "kubernetes==32.0.1" &&
              pip install --quiet --no-cache-dir --target /tmp/kjob-lib --no-deps "$KJOB_SOURCE" &&
              exec python -m kjob fair-scheduler --interval 15
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
